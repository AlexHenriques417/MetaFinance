<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaFinance - Gerenciador de Finanças e Metas</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- HEADER / NAVBAR -->
  <header style="background-color: var(--bg-secondary); border-bottom: 1px solid var(--border-color); padding: 1rem 0;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <h1 style="font-size: 1.5rem; color: var(--color-accent);">MetaFinance</h1>
      <button id="btn-logout" class="btn" style="background-color: transparent; border: 1px solid var(--border-color);">Sair</button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container" style="flex: 1; padding-bottom: 3rem;">
    
    <!-- RESUMO DE CARDS -->
    <section class="dashboard-grid">
      <div class="card">
        <h3>Saldo Total</h3>
        <p class="amount" id="total-balance">R$ 0,00</p>
      </div>
      <div class="card">
        <h3>Receitas do Mês</h3>
        <p class="amount income" id="total-income">+ R$ 0,00</p>
      </div>
      <div class="card">
        <h3>Despesas do Mês</h3>
        <p class="amount expense" id="total-expense">- R$ 0,00</p>
      </div>
    </section>

  </main>

  <!-- MODAL DE AUTENTICAÇÃO -->
  <div id="auth-modal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 400px; padding: 2rem;">
      <h2 id="auth-title" style="margin-bottom: 1.5rem; text-align: center;">Entrar no MetaFinance</h2>
      
      <form id="auth-form" style="display: flex; flex-direction: column; gap: 1rem;">
        <div id="name-group" style="display: none; flex-direction: column; gap: 0.3rem;">
          <label style="font-size: 0.85rem; color: var(--text-secondary);">Nome Completo</label>
          <input type="text" id="auth-name" style="padding: 0.6rem; border-radius: var(--radius); border: 1px solid var(--border-color); background: var(--bg-primary); color: #fff;">
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.3rem;">
          <label style="font-size: 0.85rem; color: var(--text-secondary);">E-mail</label>
          <input type="email" id="auth-email" required style="padding: 0.6rem; border-radius: var(--radius); border: 1px solid var(--border-color); background: var(--bg-primary); color: #fff;">
        </div>

        <div style="display: flex; flex-direction: column; gap: 0.3rem;">
          <label style="font-size: 0.85rem; color: var(--text-secondary);">Senha</label>
          <input type="password" id="auth-password" required style="padding: 0.6rem; border-radius: var(--radius); border: 1px solid var(--border-color); background: var(--bg-primary); color: #fff;">
        </div>

        <p id="auth-error" style="color: var(--color-expense); font-size: 0.85rem; display: none;"></p>

        <button type="submit" id="btn-auth-submit" class="btn" style="margin-top: 0.5rem;">Entrar</button>
      </form>

      <p style="margin-top: 1.5rem; font-size: 0.85rem; text-align: center; color: var(--text-secondary);">
        <span id="toggle-auth-text">Não tem uma conta?</span>
        <a href="#" id="toggle-auth-btn" style="color: var(--color-accent); text-decoration: none; font-weight: 600;">Cadastre-se</a>
      </p>
    </div>
  </div>

  <!-- ENTRADA DO SCRIPT MODULE -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
